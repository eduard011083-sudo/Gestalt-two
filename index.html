      }, []);

        if (!breathingActive) {
          setBreathPhase('idle');
          setBreathTimer(0);
          return;
        }

        let currentPhase = 'inhale';
        let timeLeft = 4;
        setBreathPhase('inhale');
        setBreathTimer(4);
        triggerHaptic('medium');

        const interval = setInterval(() => {
          timeLeft -= 1;
          if (timeLeft > 0) {
            setBreathTimer(timeLeft);
          } else {
            if (currentPhase === 'inhale') {
              currentPhase = 'hold';
              timeLeft = 2;
              setBreathPhase('hold');
              setBreathTimer(2);
              triggerHaptic('light');
            } else if (currentPhase === 'hold') {
              currentPhase = 'exhale';
              timeLeft = 6;
              setBreathPhase('exhale');
              setBreathTimer(6);
              triggerHaptic('heavy');
            } else {
              currentPhase = 'inhale';
              timeLeft = 4;
              setBreathPhase('inhale');
              setBreathTimer(4);
              triggerHaptic('medium');
            }
          }
        }, 1000);

        return () => clearInterval(interval);
      }, [breathingActive]);

      const filteredDefenses = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return DEFENSES;
        return DEFENSES.filter(d =>
          d.title.toLowerCase().includes(q) ||
          d.simpleName.toLowerCase().includes(q) ||
          d.humanPhrases.toLowerCase().includes(q) ||
          d.bodySign.toLowerCase().includes(q) ||
          d.keywords.toLowerCase().includes(q) ||
          d.summary.toLowerCase().includes(q)
        );
      }, [searchQuery]);

      const filteredDict = useMemo(() => {
        const q = dictQuery.trim().toLowerCase();
        if (!q) return DICTIONARY;
        return DICTIONARY.filter(item =>
          item.term.toLowerCase().includes(q) ||
          item.human.toLowerCase().includes(q) ||
          item.inLife.toLowerCase().includes(q) ||
          item.meaning.toLowerCase().includes(q)

        triggerHaptic('medium');
        setSelectedSosId(id);
        setTab('sos');

        triggerHaptic('medium');
        const nextScore = { ...score, [type]: (score[type] || 0) + 1 };
        setScore(nextScore);

          setCurrentQ(currentQ + 1);
        } else {
          const total = TEST_QUESTIONS.length;
          const breakdown = Object.keys(nextScore)
            .map(key => {
              const def = DEFENSES.find(d => d.id === key);
              return {
                ...def,
                count: nextScore[key],
                percent: Math.round((nextScore[key] / total) * 100)
              };
            })
            .sort((a, b) => b.count - a.count);

          setResult({
            main: breakdown[0] || DEFENSES[0],
            breakdown

          setCurrentQ(0);
          setScore({});

                          <div className="bg-teal-950/30 p-3 rounded-xl border border-teal-800/40">
                            <span className="text-teal-300 font-semibold block mb-0.5">💡 Вопрос для самопроверки:</span>
                            <span className="text-teal-100 italic">{item.therapyQuestion}</span>
                          </div>
                          <div>
                            <span className="text-indigo-400 font-semibold block mb-0.5">🎬 Пример в кино:</span>
                            <span className="text-slate-300">{item.cinemaRef}</span>
                          </div>

                          <button
                            onClick={(e) => openSosForDefense(item.id, e)}
                            className="w-full mt-2 py-2.5 px-3 bg-teal-950/80 hover:bg-teal-900/80 border border-teal-600/50 rounded-xl text-teal-300 font-semibold text-xs flex items-center justify-center gap-1.5 active:scale-[0.98] transition"
                          >
                            <span>🫁</span>
                            <span>Снять этот зажим прямо сейчас (60 сек)</span>
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* ВКЛАДКА 2: СЛОВАРЬ */}
            {tab === 'dict' && (
              <div className="space-y-3.5">
                <div className="p-3.5 bg-teal-950/30 border border-teal-800/40 rounded-2xl text-xs text-teal-200 leading-relaxed">
                  📖 <strong>Словарь без заумных слов.</strong> Перевод терминов на язык обычных жизненных ситуаций.
                </div>

                <input
                  type="text"
                  value={dictQuery}
                  onChange={(e) => setDictQuery(e.target.value)}
                  placeholder="🔍 Найти слово: гештальт, интроект, фрустрация, стыд..."
                  className="w-full bg-slate-900 border border-slate-700/80 focus:border-teal-500 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 outline-none"
                />

                <div className="space-y-3">
                  {filteredDict.map((item, idx) => (
                    <div key={idx} className="p-4 bg-slate-900/90 border border-slate-800 rounded-2xl space-y-2">
                      <div className="flex items-center justify-between gap-2 flex-wrap">
                        <h3 className="text-sm font-bold text-teal-400">{item.term}</h3>
                        <span className="text-[11px] bg-slate-800 text-slate-200 px-2.5 py-0.5 rounded-full border border-slate-700 font-medium">
                          = {item.human}
                        </span>
                      </div>
                      <div className="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800/70 text-xs">
                        <span className="text-amber-400/90 font-semibold block mb-0.5">⚡ Как это выглядит в жизни:</span>
                        <p className="text-slate-200 leading-relaxed">{item.inLife}</p>
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed pt-0.5">
                        <strong className="text-slate-100">Простыми словами:</strong> {item.meaning}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ВКЛАДКА 3: ТЕСТ + ССЫЛКА НА КАНАЛ В ИТОГАХ */}
            {tab === 'test' && (
              <div className="space-y-4">
                {!result ? (
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl space-y-4">
                    <div className="flex justify-between items-center text-xs text-slate-400">
                      <span>Ситуация {currentQ + 1} из {TEST_QUESTIONS.length}</span>
                      <span className="text-teal-400 font-medium">Самодиагностика</span>
                    </div>

                    <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                      <div
                        className="bg-teal-500 h-full transition-all duration-300"
                        style={{ width: `${((currentQ + 1) / TEST_QUESTIONS.length) * 100}%` }}
                      ></div>
                    </div>

                    <h2 className="text-sm font-semibold text-slate-100 leading-snug">
                      {TEST_QUESTIONS[currentQ].q}
                    </h2>

                    <div className="space-y-2.5 pt-1">
                      {TEST_QUESTIONS[currentQ].options.map((opt, idx) => (
                        <button
                          key={idx}
                          onClick={() => handleAnswer(opt.type)}
                          className="w-full text-left p-3.5 rounded-xl bg-slate-800/60 hover:bg-teal-950/60 border border-slate-700/60 hover:border-teal-500/60 transition-all text-xs text-slate-200 leading-relaxed active:scale-[0.98]"
                        >
                          {opt.text}
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="p-4 bg-slate-900 border border-teal-500/60 rounded-2xl space-y-4">
                    <div className="text-center space-y-1">
                      <span className="text-3xl">🧠</span>
                      <p className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">
                        Ваш защитный профиль прямо сейчас
                      </p>
                      <h2 className="text-lg font-bold text-teal-400">
                        {result.main.title}
                      </h2>
                      <p className="text-xs text-slate-300 font-medium">({result.main.simpleName})</p>
                      <p className="text-xs text-teal-300/90 italic pt-0.5">{result.main.metaphor}</p>
                    </div>

                    <div className="bg-slate-950/90 p-3.5 rounded-xl border border-slate-800 space-y-2.5">
                      <span className="text-[11px] font-semibold text-slate-400 block">
                        📊 Соотношение ваших реакций:
                      </span>
                      {result.breakdown.map((item) => (
                        <div key={item.id} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="font-semibold text-slate-200">
                              {item.title} <span className="text-slate-400 font-normal">({item.simpleName})</span>
                            </span>
                            <span className="text-teal-400 font-bold">{item.percent}%</span>
                          </div>
                          <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div
                              className="bg-teal-500 h-full rounded-full"
                              style={{ width: `${item.percent}%` }}
                            ></div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-2 text-xs">
                      <p className="text-slate-200 leading-relaxed">{result.main.summary}</p>
                      <div className="pt-2 border-t border-slate-800 space-y-1.5">
                        <p><strong className="text-amber-400">🫀 В теле:</strong> <span className="text-slate-300">{result.main.bodySign}</span></p>
                        <p><strong className="text-rose-400">💸 Цена:</strong> <span className="text-slate-300">{result.main.price}</span></p>
                      </div>
                    </div>

                    <button
                      onClick={() => openSosForDefense(result.main.id)}
                      className="w-full py-3 bg-teal-950/90 hover:bg-teal-900 border border-teal-500/60 text-teal-300 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition active:scale-[0.98]"
                    >
                      <span>🫁</span>
                      <span>Снять зажим «{result.main.title}» за 60 секунд</span>
                    </button>

                    {/* Прямая ссылка на канал автора внутри теста */}
                    <div className="bg-slate-950/60 p-3.5 rounded-xl border border-teal-800/40 flex items-center justify-between gap-3">
                      <div className="text-xs">
                        <strong className="text-teal-300 block">Авторский канал о гештальте</strong>
                        <span className="text-slate-400 text-[11px]">Разборы, практика и статьи от Эдуарда Абрамова</span>
                      </div>
                      <button
                        onClick={() => openExternalLink(CHANNEL_URL)}
                        className="py-2 px-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-lg text-xs whitespace-nowrap transition active:scale-95"
                      >
                        Перейти ↗
                      </button>
                    </div>

                    <div className="pt-2 border-t border-slate-800 space-y-2">
                      <p className="text-[11px] text-center text-slate-400">
                        Поделитесь профилем с близкими или сохраните себе:
                      </p>
                      <button
                        onClick={shareToTelegram}
                        className="w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-teal-950/50 transition active:scale-[0.98]"
                      >
                        <span>✈️</span>
                        <span>Отправить результат другу в Telegram</span>
                      </button>

                      <div className="flex gap-2">
                        <button
                          onClick={copyShareText}
                          className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl text-xs transition active:scale-[0.98]"
                        >
                          {copied ? '✅ Скопировано!' : '📋 Скопировать текст'}
                        </button>
                        <button
                          onClick={() => {
                            triggerHaptic('light');
                            setResult(null);
                          }}
                          className="py-2.5 px-4 bg-slate-800/60 hover:bg-slate-800 text-slate-400 font-medium rounded-xl text-xs transition"
                        >
                          Заново ↻
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ВКЛАДКА 4: СКОРАЯ ПОМОЩЬ */}
            {tab === 'sos' && (
              <div className="space-y-4">
                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl text-center space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-teal-400 uppercase tracking-wider">
                      🫁 Дыхание 4–2–6 (сброс кортизола)
                    </span>
                    <span className="text-[10px] text-slate-400">С вибро-пульсом</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Длинный выдох включает парасимпатическую нервную систему и сигнализирует телу: «Опасность миновала».
                  </p>

                  <div className="py-5 flex flex-col items-center justify-center">
                    <div
                      className={`w-36 h-36 rounded-full flex flex-col items-center justify-center border-2 transition-all duration-1000 ${
                        breathPhase === 'inhale'
                          ? 'scale-110 bg-teal-500/20 border-teal-400 shadow-[0_0_35px_rgba(20,184,166,0.35)]'
                          : breathPhase === 'hold'
                          ? 'scale-110 bg-amber-500/20 border-amber-400 shadow-[0_0_35px_rgba(245,158,11,0.3)]'
                          : breathPhase === 'exhale'
                          ? 'scale-90 bg-sky-500/15 border-sky-400/70'
                          : 'scale-100 bg-slate-800/70 border-slate-700'
                      }`}
                    >
                      <span className="text-sm font-bold text-slate-100">
                        {breathPhase === 'inhale' && 'ВДОХ носом'}
                        {breathPhase === 'hold' && 'ПАУЗА'}
                        {breathPhase === 'exhale' && 'ВЫДОХ ртом'}
                        {breathPhase === 'idle' && 'Готовы?'}
                      </span>
                      {breathingActive && (
                        <span className="text-2xl font-extrabold text-teal-400 mt-1">
                          {breathTimer} с
                        </span>
                      )}
                    </div>
                  </div>

                  <button
                    onClick={() => {
                      triggerHaptic('medium');
                      setBreathingActive(!breathingActive);
                    }}
                    className={`w-full py-2.5 rounded-xl font-bold text-xs transition ${
                      breathingActive
                        ? 'bg-rose-950/80 text-rose-300 border border-rose-700/60'
                        : 'bg-teal-500 text-slate-950'
                    }`}
                  >
                    {breathingActive ? '⏹ Остановить дыхание' : '▶️ Запустить дыхательный цикл'}
                  </button>
                </div>

                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
                  <span className="text-xs font-bold text-amber-400 uppercase tracking-wider block">
                    🔓 Телесная разрядка под ваш зажим
                  </span>

                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    {DEFENSES.map((d) => (
                      <button
                        key={d.id}
                        onClick={() => {
                          triggerHaptic('light');
                          setSelectedSosId(d.id);
                        }}
                        className={`whitespace-nowrap px-2.5 py-1 rounded-full text-[11px] border transition ${
                          selectedSosId === d.id
                            ? 'bg-amber-400 text-slate-950 border-amber-300 font-bold'
                            : 'bg-slate-950 text-slate-300 border-slate-800'
                        }`}
                      >
                        {d.title}
                      </button>
                    ))}
                  </div>

                  <div className="bg-slate-950/90 p-3.5 rounded-xl border border-slate-800/90 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-bold text-teal-400">
                        {activeSosDefense.sosTitle}
                      </h3>
                    </div>
                    <p className="text-[11px] text-slate-400">
                      Симптом: {activeSosDefense.bodySign}
                    </p>
                    <div className="space-y-2 pt-1">
                      {activeSosDefense.sosSteps.map((step, i) => (
                        <div key={i} className="flex items-start gap-2.5 text-xs text-slate-200">
                          <span className="w-5 h-5 rounded-full bg-teal-950 border border-teal-700/60 text-teal-400 font-bold flex items-center justify-center shrink-0 text-[11px]">
                            {i + 1}
                          </span>
                          <span className="leading-relaxed">{step}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider">
                      ⚓ Быстрое заземление «5–4–3–2–1»
                    </span>
                    <button
                      onClick={() => { triggerHaptic('light'); setCheckedSteps({}); }}
                      className="text-[11px] text-slate-400 hover:text-white"
                    >
                      Сбросить
                    </button>
                  </div>
                  <p className="text-xs text-slate-400">
                    Нажимайте на каждый пункт по мере выполнения, чтобы вернуть мозг из тревожных фантазий в «здесь и сейчас»:
                  </p>

                  <div className="space-y-2">
                    {GROUNDING_STEPS.map((s) => {
                      const done = !!checkedSteps[s.id];
                      return (
                        <button
                          key={s.id}
                          onClick={() => {
                            triggerHaptic('light');
                            setCheckedSteps({ ...checkedSteps, [s.id]: !done });
                          }}
                          className={`w-full text-left p-3 rounded-xl border text-xs flex items-center gap-3 transition ${
                            done
                              ? 'bg-teal-950/40 border-teal-600/50 text-teal-200 line-through opacity-75'
                              : 'bg-slate-950/70 border-slate-800 text-slate-200'
                          }`}
                        >
                          <span className="text-base">{done ? '✅' : s.icon}</span>
                          <span className="leading-snug flex-1">{s.label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ВКЛАДКА 5: КИНО */}
            {tab === 'cinema' && (
              <div className="space-y-3">
                <div className="p-3 bg-slate-900/80 border border-slate-800 rounded-xl text-xs text-slate-300">
                  🎬 Как выглядят психологические защиты на примере героев известных фильмов и сериалов.
                </div>

                {CINEMA_CASES.map((film, idx) => (
                  <div key={idx} className="p-4 bg-slate-900 border border-slate-800/80 rounded-2xl space-y-2">
                    <span className="text-[11px] font-bold text-teal-400 uppercase tracking-wide block">
                      {film.title}
                    </span>
                    <h3 className="text-sm font-bold text-slate-100">
                      Герой: {film.hero}
                    </h3>
                    <p className="text-[11px] font-semibold text-amber-300/90">
                      Защиты: {film.defenses}
                    </p>
                    <p className="text-xs text-slate-300 leading-relaxed pt-1">
                      {film.text}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Нижнее меню */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#090d16]/95 border-t border-slate-800/90 backdrop-blur-md flex justify-around py-2 px-1 z-30">
            <button
              onClick={() => { triggerHaptic('light'); setTab('catalog'); }}
              className={`flex flex-col items-center py-1 px-1.5 text-[10px] transition ${tab === 'catalog' ? 'text-teal-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🧩</span>
              <span>Защиты</span>
            </button>
            <button
              onClick={() => { triggerHaptic('light'); setTab('dict'); }}
              className={`flex flex-col items-center py-1 px-1.5 text-[10px] transition ${tab === 'dict' ? 'text-teal-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🗣</span>
              <span>Словарь</span>
            </button>
            <button
              onClick={() => { triggerHaptic('light'); setTab('test'); }}
              className={`flex flex-col items-center py-1 px-1.5 text-[10px] transition ${tab === 'test' ? 'text-teal-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🎯</span>
              <span>Тест</span>
            </button>
            <button
              onClick={() => { triggerHaptic('light'); setTab('sos'); }}
              className={`flex flex-col items-center py-1 px-1.5 text-[10px] transition ${tab === 'sos' ? 'text-teal-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🫁</span>
              <span>Помощь</span>
            </button>
            <button
              onClick={() => { triggerHaptic('light'); setTab('cinema'); }}
              className={`flex flex-col items-center py-1 px-1.5 text-[10px] transition ${tab === 'cinema' ? 'text-teal-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🎬</span>
              <span>Кино</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
