<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Карта Защит — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFENSES = [
      {
        id: 'retroflection',
        title: 'Ретрофлексия',
        badge: 'Удар по себе',
        metaphor: '«Запрет на выдох: сжатые челюсти и молчание»',
        summary: 'Импульс, направленный во внешний мир (злость, несогласие, потребность в нежности), останавливается на границе контакта и разворачивается внутрь себя.',
        whyNeeded: 'Помогает избежать открытого конфликта, страха отвержения или наказания в уязвимой среде.',
        price: 'Хронические мышечные зажимы, психосоматика (шея, плечи, ЖКТ), самоедство и чувство вины.',
        bodySign: 'Сжатая челюсть, задержка дыхания на вдохе, втянутые плечи, привычка кусать губы.',
        therapyQuestion: 'Что ты сейчас удерживаешь в теле? Кому на самом деле адресовано это усилие?',
        cinemaRef: 'Нора Дерст («Оставленные») — удерживает запредельную утрату внутри, разрушая собственное тело и жизнь.'
      },
      {
        id: 'projection',
        title: 'Проекция',
        badge: 'Зеркало наружу',
        metaphor: '«Вижу в других то, в чем боюсь признаться себе»',
        summary: 'Собственные подавленные импульсы, страхи, злость или желания приписываются окружающим людям.',
        whyNeeded: 'Очищает представление о себе от «нежелательных» черт, защищая эго от стыда.',
        price: 'Постоянная подозрительность, ощущение враждебности мира, одиночество и разрыв реальной связи.',
        bodySign: 'Напряжённый сканирующий взгляд, постоянный фокус внимания на поведении других.',
        therapyQuestion: 'Если бы то, в чём ты обвиняешь другого, было хоть на 5% твоим качеством — что это было бы?',
        cinemaRef: 'Дэвид Фишер («Клиент всегда мёртв») — видит во всех осуждение своей природы, проецируя внутренний стыд.'
      },
      {
        id: 'introjection',
        title: 'Интроекция',
        badge: 'Чужие правила',
        metaphor: '«Проглоченная пища без пережёвывания»',
        summary: 'Некритичное присвоение чужих установок, убеждений и требований («надо», «ты должен», «хорошие люди так не делают»).',
        whyNeeded: 'Обеспечивает базовую адаптацию в детстве и даёт быстрые ориентиры для выживания.',
        price: 'Потеря собственных желаний, жизнь по чужому сценарию, токсический стыд при несовпадении с идеалом.',
        bodySign: 'Окаменевшая осанка, ком в горле, ощущение тяжести на плечах.',
        therapyQuestion: 'Чьим голосом говорит это правило внутри тебя прямо сейчас?',
        cinemaRef: 'Оливия Киттеридж («Что знает Оливия?») — суровый гранит родительских догм о долге и выдержке.'
      },
      {
        id: 'deflection',
        title: 'Дефлексия',
        badge: 'Слив энергии',
        metaphor: '«Смех вместо слёз, увод разговора в сторону»',
        summary: 'Уклонение от прямого контакта с важным и болезненным переживанием через юмор, шутовство, болтовню или поверхностность.',
        whyNeeded: 'Спасает от чрезмерного напряжения, неловкости и опасного сближения с другим человеком.',
        price: 'Невозможность получить глубокую поддержку; отношения остаются поверхностными.',
        bodySign: 'Бегающий взгляд, суетливая жестикуляция, нервный смешок на серьезных словах.',
        therapyQuestion: 'От какого чувства ты только что ускользнул этой шуткой?',
        cinemaRef: '«Лобстер» (Йоргос Лантимос) — гротескная попытка подменить искреннюю близость формальными инструкциями.'
      },
      {
        id: 'confluence',
        title: 'Конфлюэнция (Слияние)',
        badge: 'Потеря границ',
        metaphor: '«Мы вместо Я: растворение границ»',
        summary: 'Стирание границы между собой и партнером/группой. Различия воспринимаются как катастрофа и предательство.',
        whyNeeded: 'Дает глубокое ощущение безопасности, принадлежности и иллюзию безусловной любви.',
        price: 'Панический страх отвержения, потеря себя, невозможность отделиться и заявить о своих потребностях.',
        bodySign: 'Ощущение ватности, неспособность почувствовать границы собственного тела.',
        therapyQuestion: 'Где в этом решении заканчивается твой партнёр и начинаешься ты?',
        cinemaRef: 'Мия и Елена («И повсюду тлеют пожары») — мучительное переплетение материнских проекций и слияния.'
      },
      {
        id: 'intellectualization',
        title: 'Интеллектуализация',
        badge: 'Побег в голову',
        metaphor: '«Препарировать чувство вместо того, чтобы его прожить»',
        summary: 'Мозг переводит живую боль, страх или ярость в стерильные схемы, умные рассуждения и логический анализ.',
        whyNeeded: 'Блокирует разрушительный аффект, дает чувство ложного контроля над ситуацией.',
        price: 'Эмоциональная глухота, застревание в голове, бессонница и хроническая фоновая тревога.',
        bodySign: 'Поверхностное дыхание верхушками легких, холодные руки, «голова отдельно от тела».',
        therapyQuestion: 'А если убрать все объяснения: что прямо сейчас происходит в твоем теле?',
        cinemaRef: 'Дэвид Фишер («Клиент всегда мёртв») — спасается от эмоционального шторма накладными и ценниками.'
      },
      {
        id: 'repression',
        title: 'Вытеснение',
        badge: 'Забыть всё',
        metaphor: '«Запереть дверь в подвал и выбросить ключ»',
        summary: 'Психика полностью стирает из памяти травмирующее событие или чувство, делая вид, что его не было.',
        whyNeeded: 'Позволяет сохранить целостность психики в момент шока и невыносимого стресса.',
        price: 'Огромные затраты энергии на удержание вытесненного; возвращается в виде панических атак и фобий.',
        bodySign: 'Сонливость, затуманенный взгляд, внезапная потеря сил при сложных разговорах.',
        therapyQuestion: 'Что самого страшного случится, если приоткрыть эту дверь?',
        cinemaRef: 'Камилла Прикер («Острые предметы») — полное вытеснение насилия ценой саморазрушения.'
      },
      {
        id: 'devaluation',
        title: 'Обесценивание',
        badge: 'Зеленый виноград',
        metaphor: '«Растоптать ценность, чтобы не было больно терять»',
        summary: 'Мгновенное снижение значимости человека, результата или мечты («да не больно-то и хотелось», «все они одинаковые»).',
        whyNeeded: 'Защищает от сокрушительной зависти, разочарования, отвержения и уязвимости.',
        price: 'Цинизм, пустота, невозможность долго удерживать удовлетворение от достижений.',
        bodySign: 'Кривая ухмылка, презрительный выдох, скрещенные на груди руки.',
        therapyQuestion: 'Сколько боли спрятано за этим «мне всё равно»?',
        cinemaRef: '«Пылающий» (Ли Чхан-дон) — циничный фасад богатого героя, прячущий глубокую экзистенциальную пустоту.'
      }
    ];

    const TEST_QUESTIONS = [
      {
        q: 'Когда на вас неожиданно обрушивается шквал критики или давления, первая реакция:',
        options: [
          { text: 'Сжимаю зубы, молча глотаю обиду и виню себя', type: 'retroflection' },
          { text: 'Начинаю сухо аргументировать и раскладывать всё по полочкам', type: 'intellectualization' },
          { text: 'Сразу думаю: «Да он сам неадекватный и злой!»', type: 'projection' },
          { text: 'Отшучиваюсь, перевожу тему на что-то легкое', type: 'deflection' }
        ]
      },
      {
        q: 'Что вы чаще всего делаете со своей злостью?',
        options: [
          { text: 'Оставляю внутри — в итоге болит голова или крутит шею', type: 'retroflection' },
          { text: 'Считаю, что злиться нехорошо, ведь «надо быть мудрее»', type: 'introjection' },
          { text: 'Обесцениваю источник: «Да это мелочь, ерунда пустая»', type: 'devaluation' },
          { text: 'Четко объясняю собеседнику логическую несостоятельность его слов', type: 'intellectualization' }
        ]
      },
      {
        q: 'В отношениях с близкими вам труднее всего:',
        options: [
          { text: 'Сказать прямо «мне больно» или попросить о помощи', type: 'retroflection' },
          { text: 'Осознать свои границы и не растворяться в проблемах партнера', type: 'confluence' },
          { text: 'Признать, что партнер может быть прав, а не просто придирается', type: 'projection' },
          { text: 'Выдерживать серьезные разговоры без шуток и перебиваний', type: 'deflection' }
        ]
      },
      {
        q: 'Когда рушится важный план или проект, первая автоматическая мысль:',
        options: [
          { text: '«Да не очень-то и хотелось, всё это ерунда»', type: 'devaluation' },
          { text: '«Нужно сесть, собрать факты и пересчитать риски»', type: 'intellectualization' },
          { text: '«Опять я ошибся, я всегда всё порчу сам»', type: 'retroflection' },
          { text: '«Меня подставили обстоятельства и люди вокруг»', type: 'projection' }
        ]
      },
      {
        q: 'С какими телесными ощущениями вы чаще всего сталкиваетесь при стрессе?',
        options: [
          { text: 'Сжатые челюсти, заблокированное дыхание, ком в горле', type: 'retroflection' },
          { text: 'Тело как будто «отключается», я живу только в голове', type: 'intellectualization' },
          { text: 'Внезапная сонливость, слабость и затуманенность сознания', type: 'repression' },
          { text: 'Суетливость, дерганость, желание быстрее сменить тему', type: 'deflection' }
        ]
      },
      {
        q: 'Какая установка о жизни звучит внутри чаще остальных?',
        options: [
          { text: '«Хочешь сделать хорошо — сделай сам, не надейся на других»', type: 'retroflection' },
          { text: '«Есть вещи, которые человек просто ДОЛЖЕН делать без споров»', type: 'introjection' },
          { text: '«Ни к чему нельзя привязываться слишком сильно — всё тлен»', type: 'devaluation' },
          { text: '«Главное — понимать логику и механику процессов»', type: 'intellectualization' }
        ]
      }
    ];

    const CINEMA_CASES = [
      {
        title: 'Клиент всегда мёртв (Six Feet Under)',
        hero: 'Дэвид Фишер',
        defenses: 'Интеллектуализация + Проекция + Ретрофлексия',
        text: 'Дэвид встречает катастрофическое горе и непринятие собственной гомосексуальности через параноидальную верность семейным ритуалам и счетам похоронного бюро. Он непрерывно переводит эмоциональный хаос в безупречные регламенты, а внутренний стыд проецирует на окружающих.'
      },
      {
        title: 'Оставленные (The Leftovers)',
        hero: 'Нора Дерст',
        defenses: 'Вытеснение + Ретрофлексия + Обесценивание',
        text: 'Потеряв мужа и двоих детей за одну секунду «Внезапного Ухода», Нора выстраивает мощнейший панцирь сарказма и цинизма. Она запрещает себе плакать на людях, сознательно нанимает эскортниц для выстрелов по бронежилету на себе — чистая физическая ретрофлексия невыразимой душевной боли.'
      },
      {
        title: 'Острые предметы (Sharp Objects)',
        hero: 'Камилла Прикер',
        defenses: 'Вытеснение + Ретрофлексия',
        text: 'Психика Камиллы вытесняет годы эмоционального садизма матери. Не имея возможности выплеснуть ярость наружу, ее тело буквально вырезает слова боли на собственной коже.'
      },
      {
        title: 'Что знает Оливия? (Olive Kitteridge)',
        hero: 'Оливия Киттеридж',
        defenses: 'Интроекция + Обесценивание',
        text: 'Оливия живет в тисках суровых интроектов о долге, честности и дисциплине. Любое проявление слабости или чужой нежности она немедленно срезает едким обесцениванием, защищая себя от риска оказаться отвергнутой.'
      },
      {
        title: 'Лобстер (The Lobster)',
        hero: 'Дэвид и общество отеля',
        defenses: 'Конфлюэнция (принудительное слияние) + Дефлексия',
        text: 'Антиутопия исследует доведенную до абсурда идею слияния: партнеры обязаны иметь одинаковую хромоту или близорукость, чтобы считаться парой. Любое реальное различие подавляется или высмеивается.'
      }
    ];

    function App() {
      const [tab, setTab] = useState('catalog');
      const [expandedId, setExpandedId] = useState(null);
      const [currentQ, setCurrentQ] = useState(0);
      const [score, setScore] = useState({});
      const [result, setResult] = useState(null);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      const toggleCard = (id) => {
        setExpandedId(expandedId === id ? null : id);
      };

      const handleAnswer = (type) => {
        const nextScore = { ...score, [type]: (score[type] || 0) + 1 };
        setScore(nextScore);

        if (currentQ + 1 < TEST_QUESTIONS.length) {
          setCurrentQ(currentQ + 1);
        } else {
          const topKey = Object.keys(nextScore).sort((a, b) => nextScore[b] - nextScore[a])[0];
          const found = DEFENSES.find(d => d.id === topKey) || DEFENSES[0];
          setResult(found);
          setCurrentQ(0);
          setScore({});
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-950 text-slate-100 pb-24">
          {/* Header */}
          <header className="p-4 border-b border-slate-800/80 sticky top-0 bg-slate-950/90 backdrop-blur z-20 flex items-center justify-between">
            <div>
              <h1 className="text-lg font-bold text-emerald-400">Карта Защит</h1>
              <p className="text-xs text-slate-400">Атлас механизмов прерывания контакта</p>
            </div>
            <span className="text-xs px-2.5 py-1 bg-slate-900 rounded-full border border-slate-800 text-emerald-400 font-medium">
              Gestalt Lab
            </span>
          </header>

          {/* Main Area */}
          <main className="p-4 flex-1">
            {/* TAB: CATALOG */}
            {tab === 'catalog' && (
              <div className="space-y-3">
                <div className="p-3 bg-emerald-950/40 border border-emerald-800/40 rounded-xl text-xs text-emerald-300">
                  👆 Нажмите на любую защиту, чтобы раскрыть маркеры в теле, цену защиты и терапевтический фокус.
                </div>

                {DEFENSES.map((item) => {
                  const isOpen = expandedId === item.id;
                  return (
                    <div
                      key={item.id}
                      onClick={() => toggleCard(item.id)}
                      className={`cursor-pointer rounded-2xl border transition-all duration-200 p-4 ${
                        isOpen 
                          ? 'bg-slate-900 border-emerald-500/70 shadow-lg shadow-emerald-950/30 ring-1 ring-emerald-500/30' 
                          : 'bg-slate-900/70 border-slate-800/80 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <h2 className="text-base font-bold text-slate-100">{item.title}</h2>
                          <span className="text-[10px] uppercase font-semibold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-800/40">
                            {item.badge}
                          </span>
                        </div>
                        <span className="text-sm text-slate-400">{isOpen ? '▲' : '▼'}</span>
                      </div>

                      <p className="text-xs font-medium text-emerald-300/90 mt-1 italic">
                        {item.metaphor}
                      </p>

                      <p className="text-xs text-slate-300 mt-2 leading-relaxed">
                        {item.summary}
                      </p>

                      {isOpen && (
                        <div className="mt-4 pt-3 border-t border-slate-800 space-y-3 text-xs">
                          <div>
                            <span className="text-slate-400 font-semibold block mb-0.5">🛡 Зачем возникла:</span>
                            <span className="text-slate-200">{item.whyNeeded}</span>
                          </div>
                          <div>
                            <span className="text-rose-400/90 font-semibold block mb-0.5">💸 Цена защиты:</span>
                            <span className="text-slate-200">{item.price}</span>
                          </div>
                          <div>
                            <span className="text-amber-400/90 font-semibold block mb-0.5">🫀 Маркер в теле:</span>
                            <span className="text-slate-200">{item.bodySign}</span>
                          </div>
                          <div className="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800/80">
                            <span className="text-emerald-400 font-semibold block mb-0.5">❓ Вопрос для себя:</span>
                            <span className="text-emerald-200 italic">{item.therapyQuestion}</span>
                          </div>
                          <div>
                            <span className="text-indigo-400 font-semibold block mb-0.5">🎬 В кинематографе:</span>
                            <span className="text-slate-300">{item.cinemaRef}</span>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* TAB: TEST */}
            {tab === 'test' && (
              <div className="space-y-4">
                {!result ? (
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl space-y-4">
                    <div className="flex justify-between items-center text-xs text-slate-400">
                      <span>Ситуация {currentQ + 1} из {TEST_QUESTIONS.length}</span>
                      <span className="text-emerald-400 font-medium">Диагностика</span>
                    </div>

                    <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                      <div 
                        className="bg-emerald-500 h-full transition-all duration-300"
                        style={{ width: `${((currentQ + 1) / TEST_QUESTIONS.length) * 100}%` }}
                      ></div>
                    </div>

                    <h2 className="text-sm font-semibold text-slate-100 leading-snug">
                      {TEST_QUESTIONS[currentQ].q}
                    </h2>

                    <div className="space-y-2.5 pt-2">
                      {TEST_QUESTIONS[currentQ].options.map((opt, idx) => (
                        <button
                          key={idx}
                          onClick={() => handleAnswer(opt.type)}
                          className="w-full text-left p-3 rounded-xl bg-slate-800/60 hover:bg-emerald-950/60 border border-slate-700/60 hover:border-emerald-500/60 transition-all text-xs text-slate-200 leading-relaxed active:scale-[0.98]"
                        >
                          {opt.text}
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="p-5 bg-slate-900 border border-emerald-500/60 rounded-2xl space-y-4 text-center">
                    <span className="text-4xl">🧠</span>
                    <h2 className="text-lg font-bold text-emerald-400">
                      Ваш доминирующий паттерн: {result.title}
                    </h2>
                    <p className="text-xs text-emerald-300/90 italic">{result.metaphor}</p>
                    
                    <div className="text-left bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-2 text-xs">
                      <p className="text-slate-300 leading-relaxed">{result.summary}</p>
                      <div className="pt-2 border-t border-slate-800 text-slate-400 space-y-1">
                        <p><strong className="text-emerald-400">В теле:</strong> {result.bodySign}</p>
                        <p><strong className="text-rose-400">Цена:</strong> {result.price}</p>
                      </div>
                    </div>

                    <div className="bg-emerald-950/40 p-3 rounded-xl border border-emerald-800/40 text-left text-xs">
                      <span className="text-emerald-300 font-semibold block mb-1">Фокус осознавания:</span>
                      <p className="text-emerald-100 italic">{result.therapyQuestion}</p>
                    </div>

                    <button
                      onClick={() => setResult(null)}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs transition active:scale-[0.98]"
                    >
                      Пройти заново
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB: CINEMA */}
            {tab === 'cinema' && (
              <div className="space-y-3">
                <div className="p-3 bg-slate-900/80 border border-slate-800 rounded-xl text-xs text-slate-300">
                  🎬 Разборы кинематографических характеров через призму защит и прерываний контакта.
                </div>

                {CINEMA_CASES.map((film, idx) => (
                  <div key={idx} className="p-4 bg-slate-900 border border-slate-800/80 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold text-emerald-400 uppercase tracking-wide">
                        {film.title}
                      </span>
                    </div>
                    <h3 className="text-sm font-bold text-slate-100">
                      {film.hero}
                    </h3>
                    <p className="text-[11px] font-semibold text-emerald-300/90">
                      Механизмы: {film.defenses}
                    </p>
                    <p className="text-xs text-slate-300 leading-relaxed pt-1">
                      {film.text}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Bottom Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/95 border-t border-slate-800/90 backdrop-blur flex justify-around p-2 z-30">
            <button
              onClick={() => setTab('catalog')}
              className={`flex flex-col items-center py-1 px-4 text-xs transition ${tab === 'catalog' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🧩</span>
              <span>Каталог (8)</span>
            </button>
            <button
              onClick={() => setTab('test')}
              className={`flex flex-col items-center py-1 px-4 text-xs transition ${tab === 'test' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🎯</span>
              <span>Тест (6)</span>
            </button>
            <button
              onClick={() => setTab('cinema')}
              className={`flex flex-col items-center py-1 px-4 text-xs transition ${tab === 'cinema' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base mb-0.5">🎬</span>
              <span>Кино</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
